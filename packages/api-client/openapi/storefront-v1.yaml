openapi: 3.1.0
info:
  title: Banovit Storefront API
  version: 1.0.0
  description: |
    Storefront API served by banovit-cms under /api/storefront/v1: public read-only
    catalog, plus the session-bound cart/checkout (branch feature/storefront-cart).
    Conventions: docs/05-conventions.md (snake_case, money as integer rial, {data,meta,links}, {error}).
    Implemented in banovit-cms branch feature/storefront-plp (routes/storefront.php).
servers:
  - url: https://cms-new.banovit.com/api/storefront/v1
  - url: http://127.0.0.1:8000/api/storefront/v1
paths:
  /products:
    get:
      operationId: listProducts
      summary: All published products (/shop/)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/brand'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/min_price'
        - $ref: '#/components/parameters/max_price'
        - $ref: '#/components/parameters/in_stock'
        - $ref: '#/components/parameters/on_sale'
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListing' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /categories/{path}:
    get:
      operationId: getCategory
      summary: Category page data (/shop/category/{path}/)
      parameters:
        - $ref: '#/components/parameters/categoryPath'
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories/{path}/products:
    get:
      operationId: listCategoryProducts
      summary: Products in a category subtree, with facets
      parameters:
        - $ref: '#/components/parameters/categoryPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/brand'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/min_price'
        - $ref: '#/components/parameters/max_price'
        - $ref: '#/components/parameters/in_stock'
        - $ref: '#/components/parameters/on_sale'
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListing' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{slug}:
    get:
      operationId: getBrand
      summary: Brand page data (/brand/{slug}/)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Brand
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Brand' }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{slug}/products:
    get:
      operationId: listBrandProducts
      summary: Products of one brand (brand facet is fixed and not returned)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/min_price'
        - $ref: '#/components/parameters/max_price'
        - $ref: '#/components/parameters/in_stock'
        - $ref: '#/components/parameters/on_sale'
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListing' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{slug}:
    get:
      operationId: getProduct
      summary: Product page data (/shop/{slug}/)
      parameters:
        - $ref: '#/components/parameters/productSlug'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{slug}/live:
    get:
      operationId: getProductLive
      summary: Fresh price and stock (Cache-Control 5 s), refreshed by the browser after the cached page loads
      parameters:
        - $ref: '#/components/parameters/productSlug'
      responses:
        '200':
          description: Live price/stock
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProductLive' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{slug}/reviews:
    get:
      operationId: listProductReviews
      summary: Approved reviews, newest first
      parameters:
        - $ref: '#/components/parameters/productSlug'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewListing' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProductReview
      summary: Submit a review (held for moderation). Per-IP write limit.
      parameters:
        - $ref: '#/components/parameters/productSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author_name, rating, body]
              properties:
                author_name: { type: string, minLength: 2, maxLength: 100 }
                phone: { type: string, description: 'Optional mobile 09xxxxxxxxx (Persian digits accepted)' }
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, minLength: 10, maxLength: 3000 }
                variation_id: { type: [integer, 'null'] }
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties: { id: { type: integer }, status: { type: string, const: pending } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # ── Cart & checkout (docs/api/cart.md). Session-bound: X-Cart-Token header, never cached. ──
  /cart:
    get:
      operationId: getCart
      summary: The visitor's cart (empty cart with token null when none)
      parameters: [{ $ref: '#/components/parameters/cartToken' }]
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
    patch:
      operationId: updateCart
      summary: Checkout options (address, delivery day, packaging, payment method, note, attribution)
      parameters: [{ $ref: '#/components/parameters/cartToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartUpdate' }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/items:
    post:
      operationId: addCartItem
      summary: Add a product (creates the cart when there is no token; response carries data.token)
      parameters: [{ $ref: '#/components/parameters/cartToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemCreate' }
      responses:
        '201': { $ref: '#/components/responses/CartResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{item}:
    patch:
      operationId: updateCartItem
      parameters:
        - $ref: '#/components/parameters/cartToken'
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 0, description: 0 removes the line }
                installation: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeCartItem
      parameters:
        - $ref: '#/components/parameters/cartToken'
        - { name: item, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
  /cart/coupon:
    post:
      operationId: applyCoupon
      parameters: [{ $ref: '#/components/parameters/cartToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: removeCoupon
      parameters: [{ $ref: '#/components/parameters/cartToken' }]
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
  /cart/merge:
    post:
      operationId: mergeCart
      summary: After login (Bearer customer token), fold the guest cart into the customer's
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [guest_token], properties: { guest_token: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/NotFound' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    post:
      operationId: placeOrder
      summary: Place the cart as an order (sales_invoices, source=storefront) and start payment
      parameters:
        - $ref: '#/components/parameters/cartToken'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlacedOrder' }
        '200':
          description: Replay of the same Idempotency-Key (payment is null)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlacedOrder' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{number}:
    get:
      operationId: getOrder
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
        - { name: X-Order-Token, in: header, schema: { type: string } }
      responses:
        '200':
          description: Order summary
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/OrderSummary' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{number}/payments:
    post:
      operationId: payOrder
      summary: Retry payment of a pending order
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
        - { name: X-Order-Token, in: header, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { payment_method: { type: string } } }
      responses:
        '200':
          description: Payment started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [order, payment]
                    properties:
                      order: { $ref: '#/components/schemas/OrderSummary' }
                      payment: { $ref: '#/components/schemas/PaymentStart' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/zarinpal/verify:
    post:
      operationId: verifyZarinpal
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [authority, status], properties: { authority: { type: string }, status: { type: string } } }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [paid, ref_id, order]
                    properties:
                      paid: { type: boolean }
                      ref_id: { type: [string, 'null'] }
                      order: { $ref: '#/components/schemas/OrderSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /menus/{key}:
    get:
      operationId: getMenu
      summary: Navigation menu managed in the CMS («منوهای فروشگاه»)
      description: |
        categories = desktop mega menu + mobile category sheet (level 1 category, level 2 group, level 3 items);
        header_nav = desktop nav row; header_top = desktop top bar; mobile_quick = mobile drawer «دسترسی سریع».
        Inactive items and categories/tags without products are already removed.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, enum: [categories, header_nav, header_top, mobile_quick] } }
      responses:
        '200':
          description: Menu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Menu' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings/header:
    get:
      operationId: getHeaderSettings
      summary: Header banner slides, logo, support line and UI copy («تنظیمات هدر» in the CMS)
      responses:
        '200':
          description: Header settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HeaderSettings' }
  # --- auth (feature/web-auth, banovit-cms feature/storefront-auth) ---
  /auth/otp:
    post:
      operationId: requestOtp
      summary: Send a 4-digit login code by SMS (same answer for known and unknown numbers)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 'Iranian mobile in any spelling (09…, +98…, Persian digits)' }
      responses:
        '202':
          description: Code issued (delivery happens after the response)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OtpChallenge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Check the code; returns a customer token (kept by the BFF in an httpOnly cookie)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^[0-9۰-۹]{4}$' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CustomerSession' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current customer token
      tags: [auth]
      security: [{ customerToken: [] }]
      responses:
        '204': { description: Signed out }
        '401': { description: Not signed in }
  /me:
    get:
      operationId: getMe
      tags: [auth]
      security: [{ customerToken: [] }]
      responses:
        '200':
          description: Current customer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '401': { description: Not signed in }
    patch:
      operationId: updateMe
      summary: Signup «نام و نام خانوادگی» step
      tags: [auth]
      security: [{ customerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name: { type: string, minLength: 2, maxLength: 50 }
                last_name: { type: string, minLength: 2, maxLength: 50 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '401': { description: Not signed in }
        '422': { $ref: '#/components/responses/ValidationError' }
  # --- /auth ---
  # --- sellers ---
  /sellers:
    get:
      operationId: listSellers
      summary: Public sellers (house seller first)
      responses:
        '200':
          description: Sellers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SellerCard' } }
  /sellers/{slug}:
    get:
      operationId: getSeller
      summary: Seller profile page data (/seller/{slug}/)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Seller
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Seller' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sellers/{slug}/products:
    get:
      operationId: listSellerProducts
      summary: Products this seller sells (seller facet is fixed)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/brand'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/min_price'
        - $ref: '#/components/parameters/max_price'
        - $ref: '#/components/parameters/in_stock'
        - $ref: '#/components/parameters/on_sale'
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListing' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sellers/{slug}/reviews:
    get:
      operationId: listSellerReviews
      summary: Buyer reviews of a seller (empty until the reviews module ships)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerReviewList' }
        '404': { $ref: '#/components/responses/NotFound' }
  # --- contact ---
  # --- plp ---
  /settings/listing:
    get:
      operationId: getListingSettings
      summary: Listing-page texts (support box, empty states, brands row) and the site footer, editable in the CMS («صفحه فروشگاه و فوتر»)
      responses:
        '200':
          description: Listing page + footer settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ListingSettings' }
  # --- /plp ---
  /settings/contact:
    get:
      operationId: getContactSettings
      summary: «تماس با ما» page content (/contact-us/), editable in the CMS admin app
      responses:
        '200':
          description: Contact page settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContactSettings' }
  /settings/auth:
    get:
      operationId: getAuthSettings
      summary: Texts, links and timings of the /login/ page, editable in the CMS admin app («ورود و پیامک کد»)
      responses:
        '200':
          description: Login page settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthSettings' }
  /callback-requests:
    post:
      operationId: createCallbackRequest
      summary: Visitor asks to be called back (listing callout, contact form) → CMS sales lead signal
      description: Called only by the Next.js BFF (/api/callback-requests/) with X-Storefront-Token and X-Client-IP. Rate limited per visitor IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallbackRequest' }
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [received] }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many requests
  # --- /contact ---
  # --- account (feature/web-account, banovit-cms feature/storefront-account) ---
  /me/summary:
    get:
      operationId: getAccountSummary
      summary: «پروفایل» dashboard counters
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '200': { description: Summary, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AccountSummary' } } } } } }
        '401': { description: Not signed in }
  /me/profile:
    get:
      operationId: getProfile
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Profile' } } } } } }
    patch:
      operationId: updateProfile
      summary: «اطلاعات کاربری» email, national code (checksum), birth date (Jalali 1388/01/30 or ISO)
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, 'null'], format: email }
                national_code: { type: [string, 'null'], pattern: '^\d{10}$' }
                birth_date: { type: [string, 'null'] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Profile' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/orders:
    get:
      operationId: listMyOrders
      summary: «سفارش ها» (WooCommerce orders, imported WP history and storefront orders)
      tags: [account]
      security: [{ customerToken: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [current, delivered, cancelled], default: current } }
        - { name: q, in: query, description: Order number or product name; searches all tabs, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AccountOrder' } }
                  meta:
                    type: object
                    required: [page, per_page, total, counts]
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      tab: { type: [string, 'null'] }
                      counts: { $ref: '#/components/schemas/OrderTabCounts' }
  /me/orders/{number}:
    get:
      operationId: getMyOrder
      summary: «جزئیات سفارش»
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: number, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AccountOrderDetail' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/addresses:
    get:
      operationId: listAddresses
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '200': { description: Addresses, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/CustomerAddress' } } } } } } }
    post:
      operationId: createAddress
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerAddressInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/CustomerAddress' } } } } } }
        '409': { description: Address limit (20) reached }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/addresses/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, description: ULID } }]
    patch:
      operationId: updateAddress
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerAddressInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/CustomerAddress' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAddress
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '204': { description: Deleted (the newest remaining address becomes default) }
  /me/wishlist:
    get:
      operationId: listWishlist
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, discount], default: newest } }]
      responses:
        '200':
          description: Product cards
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
                  meta: { type: object, required: [total, notify], properties: { total: { type: integer }, sort: { type: string }, notify: { type: boolean } } }
  /me/wishlist/slugs:
    get:
      operationId: listWishlistSlugs
      summary: Heart state for PLP/PDP
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '200': { description: Slugs, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { type: string } } } } } } }
  /me/wishlist/settings:
    patch:
      operationId: updateWishlistSettings
      summary: «اطلاع رسانی ها» (stock / discount alerts for wishlist items)
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [notify], properties: { notify: { type: boolean } } } } } }
      responses:
        '200': { description: Saved }
  /me/wishlist/{slug}:
    parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
    put:
      operationId: addToWishlist
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '200': { description: Added (idempotent) }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeFromWishlist
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '200': { description: Removed }
  /me/recently-viewed:
    get:
      operationId: listRecentlyViewed
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200': { description: Newest first (max 50), content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ProductCard' } } } } } } }
    post:
      operationId: recordProductView
      summary: Called by the PDP (through the BFF /api/me/recently-viewed/) for signed-in customers
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product_slug], properties: { product_slug: { type: string } } } } } }
      responses:
        '201': { description: Recorded }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: clearRecentlyViewed
      tags: [account]
      security: [{ customerToken: [] }]
      responses:
        '204': { description: Cleared }
  /me/reviews:
    get:
      operationId: listMyReviews
      summary: «دیدگاه های من» (product_reviews, owned by the PDP module)
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200': { description: Reviews, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/MyReview' } } } } } } }
    post:
      operationId: rateProduct
      summary: Star rating from a delivered order; goes to moderation (status pending)
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_slug, rating]
              properties:
                product_slug: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: [string, 'null'], maxLength: 3000 }
      responses:
        '201': { description: Created }
        '200': { description: Updated }
        '503': { description: product_reviews table not deployed yet }
  /me/notifications:
    get:
      operationId: listNotifications
      summary: «اعلانات من»
      tags: [account]
      security: [{ customerToken: [] }]
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [orders, products, support] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      unread: { type: object, additionalProperties: { type: integer } }
    delete:
      operationId: clearNotifications
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: category, in: query, schema: { type: string, enum: [orders, products, support] } }]
      responses:
        '204': { description: Deleted }
  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: Number marked read }
  /me/tickets:
    get:
      operationId: listTickets
      summary: «پشتیبانی بانویت» tickets
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: tab, in: query, schema: { type: string, enum: [in_review, reviewed], default: in_review } }]
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TicketSummary' } }
                  meta:
                    type: object
                    properties:
                      tab: { type: string }
                      counts: { type: object, properties: { in_review: { type: integer }, reviewed: { type: integer } } }
                      topics: { type: object, additionalProperties: { type: string } }
    post:
      operationId: createTicket
      summary: «ثبت گزارش» (multipart, up to 5 images of 5 MB)
      tags: [account]
      security: [{ customerToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [topic, body]
              properties:
                topic: { $ref: '#/components/schemas/TicketTopic' }
                subject: { type: string, maxLength: 200 }
                order_number: { type: string }
                body: { type: string, minLength: 5, maxLength: 5000 }
                'images[]': { type: array, items: { type: string, format: binary }, maxItems: 5 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TicketSummary' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/tickets/{id}:
    get:
      operationId: getTicket
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Conversation, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TicketDetail' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/tickets/{id}/messages:
    post:
      operationId: replyTicket
      tags: [account]
      security: [{ customerToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
                'images[]': { type: array, items: { type: string, format: binary }, maxItems: 5 }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TicketMessage' } } } } } }
        '409': { description: Ticket closed }
  /settings/account:
    get:
      operationId: getAccountSettings
      summary: Panel-edited wording/options of the customer account area (support topics, menu, empty states, map, limits)
      tags: [account]
      responses:
        '200': { description: Account settings, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AccountSettings' } } } } } }
  # --- /account ---
  # --- blog (feature/web-blog, banovit-cms feature/storefront-blog) ---
  /blog/home:
    get:
      operationId: getBlogHome
      summary: Everything the /blog/ landing renders
      responses:
        '200':
          description: Blog landing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlogHome' }
  /blog/ui:
    get:
      operationId: getBlogUi
      summary: Blog texts and page switches set in the CMS panel (labels, single post page, box labels)
      responses:
        '200':
          description: Blog UI settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlogUi' }
  /blog/posts:
    get:
      operationId: listBlogPosts
      summary: Visible posts, newest first (category includes child categories, like WordPress)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 12 } }
        - { name: category, in: query, description: 'Category path, e.g. toilet/wallhang', schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: q, in: query, description: Search in title/excerpt, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, popular], default: latest } }
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPostListing' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/posts/{slug}:
    get:
      operationId: getBlogPost
      summary: Single post (/blog/{slug}/). A renamed post answers 404 with error.code=moved and error.location.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Post
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlogPost' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/posts/{slug}/views:
    post:
      operationId: countBlogPostView
      summary: View counter (one per IP and post per 30 minutes)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Counted }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Already counted }
  /blog/categories:
    get:
      operationId: listBlogCategories
      summary: All blog categories with visible post counts
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BlogCategoryTab' } }
  /blog/categories/{path}:
    get:
      operationId: getBlogCategory
      summary: Category archive data (/blog/category/{path}/)
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlogCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/tags/{slug}:
    get:
      operationId: getBlogTag
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlogTerm' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/authors/{slug}:
    get:
      operationId: getBlogAuthor
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Author
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlogAuthorPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/sitemap/{type}:
    get:
      operationId: getBlogSitemap
      summary: Rows for post-sitemap.xml, category-sitemap.xml, post_tag-sitemap.xml, author-sitemap.xml (noindex rows excluded)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [posts, categories, tags, authors] } }
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SitemapRow' } }
  # --- /blog ---
  # --- pages ---
  /pages:
    get:
      operationId: listPages
      summary: Published CMS content pages (routing, page-sitemap.xml)
      responses:
        '200':
          description: Pages
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PageListItem' } }
  /pages/{path}:
    get:
      operationId: getPage
      summary: One content page (/{path}/), e.g. about-us, shipping-methods, terms, landing/b2b
      parameters:
        - name: path
          in: path
          required: true
          description: URL path without the outer slashes, percent-encoded or not (slashes allowed)
          schema: { type: string }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContentPage' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    customerToken: { type: http, scheme: bearer, description: Sanctum token from /auth/otp/verify (server-side only) }
  parameters:
    cartToken:
      name: X-Cart-Token
      in: header
      description: Opaque cart token (the BFF keeps it in the httpOnly bnv_cart cookie)
      schema: { type: string, maxLength: 64 }
    categoryPath:
      name: path
      in: path
      required: true
      description: Slug path after /shop/category/, e.g. vanity/cabinet-vanity (slashes allowed)
      schema: { type: string }
    productSlug:
      name: slug
      in: path
      required: true
      description: Product slug after /shop/ (decoded or percent-encoded)
      schema: { type: string }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 1 } }
    per_page: { name: per_page, in: query, schema: { type: integer, enum: [12, 24, 36, 48], default: 24 } }
    sort:
      name: sort
      in: query
      schema: { $ref: '#/components/schemas/SortKey' }
    brand: { name: brand, in: query, description: 'Comma-separated brand slugs (OR)', schema: { type: string } }
    filter:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: 'filter[pa_color]=white,black — values OR-ed inside a facet, facets AND-ed. Unknown facets are ignored.'
      schema:
        type: object
        additionalProperties: { type: string }
    min_price: { name: min_price, in: query, description: Rial, schema: { type: integer, minimum: 0 } }
    max_price: { name: max_price, in: query, description: Rial, schema: { type: integer, minimum: 0 } }
    in_stock: { name: in_stock, in: query, schema: { type: boolean } }
    on_sale: { name: on_sale, in: query, schema: { type: boolean } }
  responses:
    TooManyRequests:
      description: 'Limit hit: otp_cooldown, too_many_requests or phone_locked (Retry-After header + error.retry_after)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Stock/price/state conflict (out_of_stock, cart_changed, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CartResponse:
      description: Full cart
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Cart' }
    ValidationError:
      description: Invalid query
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    # --- contact ---
    # --- plp ---
    ListingImage:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        alt: { type: [string, 'null'] }
    ListingSettings:
      type: object
      required: [support_box, brands_row_title, empty_state, empty_category, footer]
      properties:
        support_box:
          type: object
          required: [enabled, title, button, success]
          properties:
            enabled: { type: boolean }
            title: { type: string }
            text: { type: [string, 'null'] }
            placeholder: { type: [string, 'null'] }
            button: { type: string }
            success: { type: string }
        brands_row_title: { type: string, description: '%%term_title%% = listing title' }
        empty_state:
          type: object
          required: [title, button]
          properties:
            title: { type: string }
            text: { type: [string, 'null'] }
            button: { type: string }
            image: { oneOf: [{ $ref: '#/components/schemas/ListingImage' }, { type: 'null' }] }
        empty_category:
          type: object
          required: [title, button, url]
          properties:
            title: { type: string }
            text: { type: [string, 'null'] }
            button: { type: string }
            url: { type: string }
        footer:
          type: object
          required: [site_name, columns, badges]
          properties:
            site_name: { type: string }
            tagline: { type: [string, 'null'] }
            about: { type: [string, 'null'] }
            columns:
              type: array
              items:
                type: object
                required: [title, links]
                properties:
                  title: { type: string }
                  links:
                    type: array
                    items:
                      type: object
                      required: [label, url]
                      properties: { label: { type: string }, url: { type: string } }
            badges:
              type: array
              items:
                type: object
                required: [label, image]
                properties:
                  label: { type: string }
                  url: { type: [string, 'null'] }
                  image: { type: string }
            copyright: { type: [string, 'null'], description: '%%year%% = Jalali year' }
    # --- /plp ---
    ContactSettings:
      type: object
      description: Every visible text and image of /contact-us/ is edited in the CMS (صفحه تماس با ما); the page hardcodes none.
      required: [path, page_bar, heading, phones, phones_caption, locations, map, form, socials, opening_hours, seo]
      properties:
        path: { type: string, examples: ['/contact-us/'] }
        page_bar:
          type: object
          description: Mobile bar above the intro (not an H1)
          required: [title, subtitle]
          properties:
            title: { type: [string, 'null'] }
            subtitle: { type: [string, 'null'] }
        heading: { type: string }
        intro: { type: [string, 'null'] }
        hours_title: { type: [string, 'null'] }
        hours_note: { type: [string, 'null'] }
        opening_hours:
          type: array
          items:
            type: object
            required: [days, opens, closes]
            properties:
              days: { type: array, items: { type: string, enum: [Saturday, Sunday, Monday, Tuesday, Wednesday, Thursday, Friday] } }
              opens: { type: string, examples: ['09:00'] }
              closes: { type: string, examples: ['17:00'] }
        phones:
          type: array
          items:
            type: object
            required: [label, number, tel]
            properties:
              label: { type: string }
              number: { type: string, description: Latin digits, e.g. 02191014093 }
              tel: { type: string, description: 'E.164 for tel: links, e.g. +982191014093' }
        phones_caption: { type: [string, 'null'], description: Caption under the phone numbers }
        email: { type: [string, 'null'] }
        locations:
          type: array
          items:
            type: object
            required: [label, street_address, locality, icon, is_primary, display]
            properties:
              label: { type: string }
              street_address: { type: string }
              locality: { type: string }
              region: { type: [string, 'null'] }
              postal_code: { type: [string, 'null'] }
              icon: { type: string, enum: [office, warehouse, store] }
              is_primary: { type: boolean, description: The LocalBusiness address in JSON-LD }
              display: { type: string }
        map:
          type: object
          required: [zoom, directions_url, neshan_label, directions_label]
          properties:
            lat: { type: [number, 'null'] }
            lng: { type: [number, 'null'] }
            zoom: { type: integer }
            pin_label: { type: [string, 'null'] }
            image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
            neshan_url: { type: [string, 'null'] }
            directions_url: { type: string }
            neshan_label: { type: string, description: Button text when neshan_url is set }
            directions_label: { type: string, description: Button text otherwise }
        form:
          type: object
          required: [title, submit_label, success_message, success_title, again_label, sending_label, name_label, phone_label, message_label, error_name, error_phone, error_message, error_rate_limit, error_generic, error_network]
          properties:
            title: { type: string }
            message_placeholder: { type: [string, 'null'] }
            submit_label: { type: string }
            success_message: { type: string }
            success_title: { type: string }
            again_label: { type: string }
            sending_label: { type: string }
            name_label: { type: string }
            name_placeholder: { type: [string, 'null'] }
            phone_label: { type: string }
            phone_placeholder: { type: [string, 'null'] }
            message_label: { type: string }
            error_name: { type: string }
            error_phone: { type: string }
            error_message: { type: string }
            error_rate_limit: { type: string }
            error_generic: { type: string }
            error_network: { type: string }
        socials:
          type: array
          items:
            type: object
            required: [network, label, url]
            properties:
              network: { type: string, enum: [whatsapp, telegram, instagram, bale, rubika, eitaa, aparat, linkedin] }
              label: { type: string, description: Display name (link text when there is no icon) }
              url: { type: string }
              icon: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }], description: Original file from live wp-content/uploads; null = no file on live }
        logo: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }], description: Brand mark (live upload) for the intro and map pin }
        seo:
          allOf:
            - $ref: '#/components/schemas/Seo'
            - type: object
              properties:
                og_type: { type: string, enum: [article, website] }
                h1: { type: [string, 'null'], description: Live page has none }
                json_ld:
                  description: JSON-LD blocks rendered verbatim (live parity); null = generated
                  oneOf: [{ type: array, items: { type: object, additionalProperties: true } }, { type: 'null' }]
    CallbackRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: Iranian mobile, Persian digits allowed }
        name: { type: [string, 'null'], maxLength: 100 }
        message: { type: [string, 'null'], maxLength: 1000 }
        form: { type: string, enum: [callout, contact], default: callout }
        page_url: { type: [string, 'null'], maxLength: 500 }
        page_title: { type: [string, 'null'], maxLength: 200 }
        website: { type: [string, 'null'], description: Honeypot; must be empty }
    # --- /contact ---
    SortKey:
      type: string
      enum: [relevant, newest, popular, price_asc, price_desc, featured, rating]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Integer rial }
        currency: { type: string, const: IRR }
    Image:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        alt: { type: [string, 'null'] }
        blurhash: { type: [string, 'null'] }
    Seo:
      type: object
      required: [title, canonical, robots]
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        canonical: { type: string }
        robots: { type: string }
        og_title: { type: [string, 'null'] }
        og_description: { type: [string, 'null'] }
        og_image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
    Faq:
      type: object
      required: [id, question, answer_html]
      properties:
        id: { type: integer }
        question: { type: string }
        answer_html: { type: string }
    BreadcrumbItem:
      type: object
      required: [id, name, url]
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
    CategoryChild:
      type: object
      required: [id, name, url, product_count]
      properties:
        id: { type: integer }
        name: { type: string }
        path: { type: string }
        url: { type: string }
        image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        product_count: { type: integer }
    Category:
      type: object
      required: [id, name, slug, path, url, product_count, breadcrumb, children, seo, faqs]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        path: { type: string }
        url: { type: string, description: 'Site-relative, trailing slash, percent-encoded' }
        description_html: { type: [string, 'null'] }
        banner: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        product_count: { type: integer }
        breadcrumb: { type: array, items: { $ref: '#/components/schemas/BreadcrumbItem' } }
        children: { type: array, items: { $ref: '#/components/schemas/CategoryChild' } }
        seo: { $ref: '#/components/schemas/Seo' }
        faqs: { type: array, items: { $ref: '#/components/schemas/Faq' } }
    Brand:
      type: object
      required: [id, name, slug, url, breadcrumb, seo, faqs]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        logo: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }], description: 'pa_brand brand_logo (live upload)' }
        description_html: { type: [string, 'null'], description: 'Brand intro (WP pa_brand term description)' }
        breadcrumb: { type: array, items: { $ref: '#/components/schemas/BreadcrumbItem' } }
        seo: { $ref: '#/components/schemas/Seo' }
        faqs: { type: array, items: { $ref: '#/components/schemas/Faq' } }
    # --- sellers ---
    SellerStats:
      type: object
      required: [rating, sales_count, product_count, joined_at, years_on_banovit]
      properties:
        rating:
          oneOf:
            - type: object
              required: [average, count]
              properties:
                average: { type: number }
                count: { type: integer }
            - type: 'null'
        sales_count: { type: integer }
        product_count: { type: integer }
        joined_at: { type: [string, 'null'], format: date }
        years_on_banovit: { type: [integer, 'null'] }
    SellerCard:
      type: object
      required: [id, slug, name, url, tagline, logo, is_house, stats]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        url: { type: string, description: '/seller/{slug}/' }
        tagline: { type: [string, 'null'] }
        logo: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        is_house: { type: boolean, description: 'Banovit itself' }
        stats: { $ref: '#/components/schemas/SellerStats' }
    OpeningRange:
      type: object
      required: [open, close]
      properties:
        open: { type: string, description: 'HH:MM, Asia/Tehran' }
        close: { type: string }
    OpeningDay:
      type: object
      required: [day, label, ranges]
      properties:
        day: { type: string, enum: [sat, sun, mon, tue, wed, thu, fri] }
        label: { type: string }
        ranges: { type: array, description: 'Empty = closed that day', items: { $ref: '#/components/schemas/OpeningRange' } }
    Seller:
      allOf:
        - $ref: '#/components/schemas/SellerCard'
        - type: object
          required: [about_html, location, opening_hours, breadcrumb, seo]
          properties:
            about_html: { type: [string, 'null'] }
            location:
              oneOf:
                - type: object
                  required: [address, lat, lng]
                  properties:
                    address: { type: [string, 'null'] }
                    lat: { type: [number, 'null'] }
                    lng: { type: [number, 'null'] }
                - type: 'null'
            opening_hours:
              oneOf:
                - type: object
                  required: [timezone, days]
                  properties:
                    timezone: { type: string, const: Asia/Tehran }
                    days: { type: array, items: { $ref: '#/components/schemas/OpeningDay' } }
                - type: 'null'
            breadcrumb: { type: array, items: { $ref: '#/components/schemas/BreadcrumbItem' } }
            seo: { $ref: '#/components/schemas/Seo' }
    SellerReview:
      type: object
      required: [id, author, rating, body, created_at, product]
      properties:
        id: { type: integer }
        author:
          type: object
          required: [name, avatar, is_buyer, is_experienced_buyer]
          properties:
            name: { type: string }
            avatar: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
            is_buyer: { type: boolean, description: '«خریدار» badge' }
            is_experienced_buyer: { type: boolean, description: '«خریدار فعال و باتجربه بانویت»' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        created_at: { type: string, format: date-time }
        product:
          oneOf:
            - type: object
              required: [name, path, image, variant_label]
              properties:
                name: { type: string }
                path: { type: string }
                image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
                variant_label: { type: [string, 'null'], description: 'e.g. «رنگ طوسی • سایز ۷۵x۹۸»' }
            - type: 'null'
    SellerReviewList:
      type: object
      required: [data, meta, links]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SellerReview' } }
        meta:
          type: object
          required: [page, per_page, total, last_page, rating]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
            rating: { $ref: '#/components/schemas/SellerStats/properties/rating' }
        links:
          type: object
          properties:
            prev_page: { type: [integer, 'null'] }
            next_page: { type: [integer, 'null'] }
    ProductCard:
      type: object
      required: [id, slug, name, path, price, discount_percent, in_stock, colors, colors_more, badges]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        path: { type: string, description: '/shop/{slug}/' }
        image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        brand:
          oneOf:
            - type: object
              required: [slug, name]
              properties: { slug: { type: string }, name: { type: string } }
            - type: 'null'
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        price_max: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Set when variants differ in price' }
        regular_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Set only when discounted' }
        discount_percent: { type: integer }
        in_stock: { type: boolean }
        rating:
          oneOf:
            - type: object
              required: [average, count]
              properties: { average: { type: number }, count: { type: integer } }
            - type: 'null'
        colors:
          type: array
          items:
            type: object
            required: [slug, name]
            properties: { slug: { type: string }, name: { type: string }, hex: { type: [string, 'null'] } }
        colors_more: { type: integer }
        sizes:
          oneOf:
            - type: object
              required: [label, values, more]
              properties:
                label: { type: string }
                values: { type: array, items: { type: string } }
                more: { type: integer }
            - type: 'null'
        badges:
          type: object
          required: [install_service, amazing_discount]
          properties:
            install_service: { type: boolean }
            amazing_discount: { type: boolean }
    FacetOption:
      type: object
      required: [value, label, count, selected]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }
        selected: { type: boolean }
        hex: { type: [string, 'null'] }
        image: { $ref: '#/components/schemas/Image', description: 'Brand logo (brand facet only)' }
    Facet:
      type: object
      required: [key, label, type, searchable, options]
      properties:
        key: { type: string, description: 'brand or a pa_* attribute slug' }
        label: { type: string }
        type: { type: string, enum: [checkbox, swatch] }
        searchable: { type: boolean }
        options: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
    AppliedFilter:
      type: object
      required: [facet, value, label]
      properties:
        facet: { type: string }
        value: { type: string }
        label: { type: string }
    ListingMeta:
      type: object
      required: [page, per_page, total, last_page, sort, sorts, facets, price, in_stock, on_sale, applied, has_filters]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        sort: { $ref: '#/components/schemas/SortKey' }
        sorts:
          type: array
          items:
            type: object
            required: [value, label]
            properties: { value: { $ref: '#/components/schemas/SortKey' }, label: { type: string } }
        facets: { type: array, items: { $ref: '#/components/schemas/Facet' } }
        price:
          type: object
          required: [min, max, selected_min, selected_max, currency]
          properties:
            min: { type: [integer, 'null'] }
            max: { type: [integer, 'null'] }
            selected_min: { type: [integer, 'null'] }
            selected_max: { type: [integer, 'null'] }
            currency: { type: string, const: IRR }
        in_stock:
          type: object
          required: [count, selected]
          properties: { count: { type: integer }, selected: { type: boolean } }
        on_sale:
          type: object
          required: [count, selected]
          properties: { count: { type: integer }, selected: { type: boolean } }
        applied: { type: array, items: { $ref: '#/components/schemas/AppliedFilter' } }
        has_filters: { type: boolean }
        categories:
          type: array
          description: Only on /products — top-level categories for the shop page
          items: { $ref: '#/components/schemas/CategoryChild' }
    ProductListing:
      type: object
      required: [data, meta, links]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        meta: { $ref: '#/components/schemas/ListingMeta' }
        links:
          type: object
          required: [prev_page, next_page]
          properties:
            prev_page: { type: [integer, 'null'] }
            next_page: { type: [integer, 'null'] }
    ProductOptionValue:
      type: object
      required: [value, label, hex]
      properties:
        value: { type: string, description: 'Term slug (same as WordPress ?attribute_pa_x=) or the label for custom attributes' }
        label: { type: string }
        hex: { type: [string, 'null'] }
    ProductOption:
      type: object
      required: [key, label, type, values]
      properties:
        key: { type: string, description: 'pa_* facet key, or attr_N for custom attributes' }
        label: { type: string }
        type: { type: string, enum: [swatch, button] }
        values: { type: array, items: { $ref: '#/components/schemas/ProductOptionValue' } }
    ProductVariant:
      type: object
      required: [id, sku, attributes, price, regular_price, discount_percent, in_stock, image]
      properties:
        id: { type: integer, description: 'variation_id for the cart' }
        sku: { type: [string, 'null'] }
        attributes:
          type: object
          description: 'option key -> value; null means any value'
          additionalProperties: { type: [string, 'null'] }
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        regular_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discount_percent: { type: integer }
        in_stock: { type: boolean }
        image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
    ProductAddonOption:
      type: object
      required: [id, label, description, price, price_type, percent, color, kind, default]
      properties:
        id: { type: integer, description: 'Sent to the cart in addon_ids' }
        label: { type: string }
        description: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        price_type: { type: string, enum: [fixed, percentage, flat_rate], description: 'fixed = per unit; percentage = percent of the unit price, per unit; flat_rate = once per cart line' }
        percent: { type: [number, 'null'], description: 'percentage options only' }
        color: { type: [string, 'null'], description: 'Swatch for display=color (#rrggbb)' }
        kind: { type: string, description: 'installation | other' }
        default: { type: boolean }
    ProductAddon:
      type: object
      required: [id, title, description, type, display, required, options]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        type: { type: string, enum: [checkbox, radio] }
        display: { type: string, enum: [select, multiselect, button, color], description: 'Rico-wc-addons control type' }
        required: { type: boolean }
        options: { type: array, items: { $ref: '#/components/schemas/ProductAddonOption' } }
    ProductRating:
      type: object
      required: [average, count, distribution]
      properties:
        average: { type: number }
        count: { type: integer }
        distribution: { type: object, additionalProperties: { type: integer }, description: '"5".."1" -> count' }
    Review:
      type: object
      required: [id, author_name, is_verified_buyer, rating, body, variant_label, likes, dislikes, published_at]
      properties:
        id: { type: integer }
        author_name: { type: string }
        is_verified_buyer: { type: boolean }
        rating: { type: [integer, 'null'] }
        body: { type: string }
        variant_label: { type: [string, 'null'] }
        likes: { type: integer }
        dislikes: { type: integer }
        published_at: { type: [string, 'null'], format: date-time }
    ReviewListing:
      type: object
      required: [data, meta, links]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Review' } }
        meta:
          type: object
          required: [page, per_page, total, last_page, rating]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
            rating: { oneOf: [{ $ref: '#/components/schemas/ProductRating' }, { type: 'null' }] }
        links:
          type: object
          required: [prev_page, next_page]
          properties:
            prev_page: { type: [integer, 'null'] }
            next_page: { type: [integer, 'null'] }
    ShippingLine:
      type: object
      required: [icon, label, text]
      properties: { icon: { type: string }, label: { type: string }, text: { type: string } }
    ProductLive:
      type: object
      required: [id, price, price_max, regular_price, discount_percent, in_stock, availability, variants, offers]
      properties:
        id: { type: integer }
        offers: { $ref: '#/components/schemas/ProductOffers' }
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        price_max: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        regular_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discount_percent: { type: integer }
        in_stock: { type: boolean }
        availability: { $ref: '#/components/schemas/Availability' }
        variants:
          type: array
          items:
            type: object
            required: [id, price, regular_price, discount_percent, in_stock]
            properties:
              id: { type: integer }
              price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              regular_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              discount_percent: { type: integer }
              in_stock: { type: boolean }
    Availability:
      type: string
      enum: [in_stock, out_of_stock, backorder, no_price]
    ProductOffers:
      type: object
      description: 'Every seller''s price per sellable unit. The page selects the house offer by default when in stock, else the cheapest in-stock one.'
      required: [sellers, items]
      properties:
        sellers: { type: array, items: { $ref: '#/components/schemas/SellerCard' } }
        items:
          type: array
          items:
            type: object
            required: [seller, variant_id, price, regular_price, in_stock]
            properties:
              seller: { type: string, description: 'SellerCard.slug; sent to the cart as seller (house seller: null)' }
              variant_id: { type: [integer, 'null'], description: 'null = simple product' }
              price: { $ref: '#/components/schemas/Money' }
              regular_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              in_stock: { type: boolean }
    VanityCalculator:
      type: object
      description: 'Public-vanity price form: price = length_cm × (slab_price_per_cm [+ frame_price_per_cm]) + bowls × bowl_price'
      required: [kind, title, frame_label, min_length_cm, max_length_cm, width_cm, min_bowls, max_bowls, slab_price_per_cm, frame_price_per_cm, bowl_price]
      properties:
        kind: { type: string, const: vanity }
        title: { type: string }
        frame_label: { type: string, description: 'Label of the frame option («پایه و کلاف فلزی و پیشانی»)' }
        min_length_cm: { type: integer }
        max_length_cm: { type: integer }
        width_cm: { type: integer }
        min_bowls: { type: integer }
        max_bowls: { type: integer }
        slab_price_per_cm: { $ref: '#/components/schemas/Money' }
        frame_price_per_cm: { $ref: '#/components/schemas/Money' }
        bowl_price: { $ref: '#/components/schemas/Money' }
    ProductDetail:
      type: object
      required: [id, slug, name, path, type, sku, brand, primary_category, breadcrumb, images, short_description_html, description_html, key_features, specs, price, price_max, regular_price, discount_percent, in_stock, availability, price_valid_until, options, variants, addons, offers, badges, label, availability_note, made_to_order, made_to_order_title, consult_phone, calculator, default_selection, videos, shipping_html, rating, reviews, seller, faqs, related, related_posts, seo, updated_at]
      properties:
        label: { type: [string, 'null'], description: 'e.g. «سفارشی»' }
        availability_note: { type: [string, 'null'], description: 'Production time / stock text, HTML (ACF text_mojodi on live)' }
        default_selection:
          type: [object, 'null']
          description: 'The variation live opens on (WC default attributes), as option key => value. Null: cheapest in-stock.'
          additionalProperties: { type: string }
        videos:
          type: array
          description: 'Product videos (woodmart): an mp4 URL or a YouTube/Vimeo page URL, with the gallery image as poster'
          items:
            type: object
            required: [video_url, poster]
            properties:
              video_url: { type: string }
              poster: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        shipping_html: { type: [string, 'null'], description: 'Per-product delivery time text (ACF send-product on live), HTML' }
        offers: { $ref: '#/components/schemas/ProductOffers' }
        made_to_order: { type: boolean, description: 'No online purchase: show the «سفارشی تولید می‌شود + مشاوره رایگان» box' }
        made_to_order_title: { type: string, description: 'Heading of the made-to-order box (admin store settings › product page)' }
        consult_phone: { type: string }
        calculator: { oneOf: [{ $ref: '#/components/schemas/VanityCalculator' }, { type: 'null' }] }
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        path: { type: string, description: '/shop/{slug}/ lowercase percent-encoded, like WordPress' }
        type: { type: string, enum: [simple, variable] }
        sku: { type: [string, 'null'] }
        brand:
          oneOf:
            - type: object
              required: [slug, name, url]
              properties: { slug: { type: string }, name: { type: string }, url: { type: string } }
            - type: 'null'
        primary_category:
          oneOf:
            - type: object
              required: [id, name, url]
              properties: { id: { type: integer }, name: { type: string }, url: { type: string } }
            - type: 'null'
        breadcrumb: { type: array, items: { $ref: '#/components/schemas/BreadcrumbItem' }, description: 'Category chain, root first (the product is appended by the page)' }
        images: { type: array, items: { $ref: '#/components/schemas/Image' } }
        short_description_html: { type: [string, 'null'] }
        description_html: { type: [string, 'null'] }
        key_features: { type: array, items: { type: string } }
        specs:
          type: array
          items:
            type: object
            required: [label, value]
            properties: { label: { type: string }, value: { type: string } }
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        price_max: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        regular_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discount_percent: { type: integer }
        in_stock: { type: boolean }
        availability: { $ref: '#/components/schemas/Availability' }
        price_valid_until: { type: [string, 'null'], format: date }
        options: { type: array, items: { $ref: '#/components/schemas/ProductOption' } }
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
        addons: { type: array, items: { $ref: '#/components/schemas/ProductAddon' } }
        badges:
          type: object
          required: [install_service]
          properties: { install_service: { type: boolean } }
        rating: { oneOf: [{ $ref: '#/components/schemas/ProductRating' }, { type: 'null' }], description: 'Null unless there are approved rated reviews (no AggregateRating then)' }
        reviews:
          type: object
          required: [total, items]
          properties:
            total: { type: integer }
            items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        seller:
          type: object
          required: [name, badge, logo, warranty, shipping]
          properties:
            name: { type: string }
            badge: { type: [string, 'null'] }
            logo: { type: [string, 'null'] }
            warranty: { type: string }
            shipping:
              type: object
              required: [title, lines, url]
              properties:
                title: { type: string }
                lines: { type: array, items: { $ref: '#/components/schemas/ShippingLine' } }
                url: { type: string }
        faqs: { type: array, items: { $ref: '#/components/schemas/Faq' } }
        related: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        related_posts:
          type: array
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string }
              url: { type: string }
              image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
              category: { type: [string, 'null'] }
              published_at: { type: [string, 'null'] }
        seo: { $ref: '#/components/schemas/Seo' }
        updated_at: { type: [string, 'null'], format: date-time }
    HeaderSettings:
      type: object
      required: [top_banner, logo, support, texts]
      properties:
        top_banner:
          type: object
          required: [enabled, interval_seconds, slides]
          properties:
            enabled: { type: boolean }
            interval_seconds: { type: integer }
            slides:
              type: array
              items:
                type: object
                required: [image]
                properties:
                  url: { type: [string, 'null'] }
                  image: { type: string }
                  mobile_image: { type: [string, 'null'] }
                  alt: { type: [string, 'null'] }
        logo:
          type: object
          required: [image, alt, width, height]
          properties:
            image: { type: string }
            alt: { type: string }
            width: { type: integer }
            height: { type: integer }
        support:
          type: object
          required: [phones]
          properties:
            label: { type: [string, 'null'] }
            hours: { type: [string, 'null'] }
            phones:
              type: array
              items:
                type: object
                required: [number, display]
                properties:
                  number: { type: string }
                  display: { type: string }
        texts:
          type: object
          description: 'UI copy keyed by name (search_placeholder, sheet_title, ...); null = use the built-in default. :count / :query are placeholders.'
          additionalProperties: { type: [string, 'null'] }
    Menu:
      type: object
      required: [key, name, items]
      properties:
        key: { type: string }
        name: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
    MenuItem:
      type: object
      required: [id, title, url, image, icon, product_count, highlight, promo, children]
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string, description: 'Site-relative path (/shop/category/x/) or absolute external URL' }
        image: { oneOf: [{ $ref: '#/components/schemas/MenuImage' }, { type: 'null' }] }
        icon: { type: [string, 'null'], description: 'Icon image URL, or a built-in icon name (discount, bestseller, newest, track, phone, article, user)' }
        product_count: { type: [integer, 'null'], description: 'Published products of the linked category/tag; null for plain links or when hidden' }
        highlight: { type: boolean }
        promo: { oneOf: [{ $ref: '#/components/schemas/MenuPromo' }, { type: 'null' }] }
        children: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
    MenuImage:
      type: object
      required: [url]
      properties:
        url: { type: string }
        alt: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
    MenuPromo:
      type: object
      properties:
        image_url: { type: string }
        title: { type: string }
        badge: { type: string }
        button_text: { type: string }
        url: { type: string }
    # --- pages ---
    PageListItem:
      type: object
      required: [id, path, url, title, indexable, updated_at]
      properties:
        id: { type: integer }
        path: { type: string }
        url: { type: string }
        title: { type: string }
        indexable: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }
    PageCrumb:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    ContentBlock:
      type: object
      description: 'Typed block {id, type, v, props}. Types and props: banovit-cms App\Domain\Content\Blocks\BlockRegistry; TS union in apps/web/src/features/pages/types.ts.'
      required: [id, type, v, props]
      properties:
        id: { type: string }
        type: { type: string }
        v: { type: integer }
        props: { type: object, additionalProperties: true }
    ContentPage:
      type: object
      required: [id, title, slug, path, url, template, blocks, breadcrumb, seo, faqs]
      properties:
        id: { type: integer }
        title: { type: string, description: H1 }
        slug: { type: string }
        path: { type: string }
        url: { type: string, description: 'Site-relative, trailing slash, percent-encoded' }
        template: { type: string, enum: [default, document, feature] }
        excerpt: { type: [string, 'null'] }
        hero_image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        blocks: { type: array, items: { $ref: '#/components/schemas/ContentBlock' } }
        body_html: { type: [string, 'null'], description: 'Sanitized HTML; rendered when blocks is empty' }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        breadcrumb: { type: array, items: { $ref: '#/components/schemas/PageCrumb' } }
        seo: { $ref: '#/components/schemas/Seo' }
        faqs: { type: array, items: { $ref: '#/components/schemas/Faq' } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            location: { type: string, description: 'Only with code=moved: the current URL (answer with a 301)' }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
            retry_after: { type: integer, description: Seconds until the request may be retried (429) }
            attempts_left: { type: integer, description: Wrong OTP tries left for the current code (otp_invalid) }
    # ── cart ──
    Address:
      type: object
      properties:
        title: { type: string }
        recipient_name: { type: string }
        recipient_phone: { type: string }
        province: { type: string }
        city: { type: string }
        address_line: { type: string }
        plaque: { type: string }
        unit: { type: string }
        postal_code: { type: string }
        lat: { type: number }
        lng: { type: number }
    CartItemCreate:
      type: object
      required: [product_id]
      properties:
        product_id: { type: integer }
        variation_id: { type: [integer, 'null'] }
        variant_id: { type: [integer, 'null'], description: Alias of variation_id }
        quantity: { type: integer, minimum: 1, default: 1 }
        installation: { type: boolean }
        addon_ids: { type: array, items: { type: integer }, description: PDP add-on option ids (installation service) }
        seller: { type: [string, 'null'], description: 'Storefront seller slug; null/absent = Banovit itself. 422 seller_offer_unavailable when that seller has no live offer' }
    CartUpdate:
      type: object
      properties:
        packaging: { type: boolean }
        delivery_date: { type: [string, 'null'], format: date }
        shipping_method: { type: [string, 'null'], description: 'Key from delivery.methods; null = first offered. 422 invalid_shipping_method' }
        installation_date: { type: [string, 'null'], format: date, description: 'From installation_schedule.slots; 422 invalid_installation_date' }
        installation_slot: { type: [string, 'null'], description: 'times[].key of that day, e.g. 09:00-13:00' }
        address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
        address_id: { type: [string, 'null'], description: Saved customer address (signed-in) }
        payment_method: { type: [string, 'null'] }
        customer_note: { type: [string, 'null'] }
        attribution: { type: object, additionalProperties: { type: string } }
    CartLine:
      type: object
      required: [id, product, variation, quantity, max_quantity, unit_price, unit_regular_price, discount_percent, line_total, line_regular_total, purchasable, issue, installation]
      properties:
        id: { type: integer }
        seller:
          description: 'Seller of this line: the marketplace seller, else the house seller profile (admin «فروشندگان», supplier-less row); null only when no house seller profile exists'
          oneOf:
            - { type: object, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
            - { type: 'null' }
        product:
          type: object
          required: [id, name, slug, path, image, brand]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
            path: { type: string }
            image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
            brand:
              oneOf:
                - { type: object, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
                - { type: 'null' }
        variation:
          oneOf:
            - type: object
              required: [id, attributes]
              properties:
                id: { type: integer }
                attributes: { type: array, items: { type: object, required: [name, value], properties: { name: { type: string }, value: { type: string } } } }
            - { type: 'null' }
        quantity: { type: integer }
        max_quantity: { type: integer }
        unit_price: { $ref: '#/components/schemas/Money' }
        unit_regular_price: { $ref: '#/components/schemas/Money' }
        discount_percent: { type: integer }
        line_total: { $ref: '#/components/schemas/Money' }
        line_regular_total: { $ref: '#/components/schemas/Money' }
        addons:
          type: array
          description: 'Selected non-installation add-ons (anti-fog, light colour …), already included in line_total'
          items: { type: object, required: [id, label, total], properties: { id: { type: integer }, label: { type: string }, total: { $ref: '#/components/schemas/Money' } } }
        purchasable: { type: boolean }
        issue:
          oneOf:
            - { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
            - { type: 'null' }
        installation:
          type: object
          required: [available, available_in_zone, selected, addon_ids, unit_fee, total]
          properties:
            available: { type: boolean }
            available_in_zone: { type: boolean }
            selected: { type: boolean }
            addon_ids: { type: array, items: { type: integer } }
            unit_fee: { $ref: '#/components/schemas/Money' }
            total: { $ref: '#/components/schemas/Money' }
    DeliverySlot:
      type: object
      required: [date, weekday, day_label, fee]
      properties:
        date: { type: string, format: date }
        weekday: { type: string }
        day_label: { type: string, description: Jalali, e.g. «۲۷ شهریور» }
        fee: { $ref: '#/components/schemas/Money' }
    PaymentMethod:
      type: object
      required: [key, label, available, description]
      properties:
        key: { type: string, enum: [zarinpal, card_to_card, installments] }
        label: { type: string }
        available: { type: boolean }
        description: { type: [string, 'null'] }
    CartTotals:
      type: object
      required: [items_regular, items, product_discount, installation, packaging, shipping, service_fee, coupon_discount, payable, savings]
      properties:
        items_regular: { $ref: '#/components/schemas/Money' }
        items: { $ref: '#/components/schemas/Money' }
        product_discount: { $ref: '#/components/schemas/Money' }
        installation: { $ref: '#/components/schemas/Money' }
        packaging: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        service_fee: { $ref: '#/components/schemas/Money' }
        service_fee_label: { type: string, description: 'Row title for service_fee (admin «تنظیمات فروشگاه › سبد و سفارش»)' }
        coupon_discount: { $ref: '#/components/schemas/Money' }
        payable: { $ref: '#/components/schemas/Money' }
        savings: { $ref: '#/components/schemas/Money' }
    Cart:
      type: object
      required: [token, item_count, items, options, coupon, delivery, addons, payment_methods, totals, issues, ready_for_checkout]
      properties:
        token: { type: [string, 'null'] }
        item_count: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        options:
          type: object
          required: [packaging, delivery_date, address, payment_method, customer_note]
          properties:
            packaging: { type: boolean }
            delivery_date: { type: [string, 'null'], format: date }
            shipping_method: { type: [string, 'null'] }
            installation_date: { type: [string, 'null'], format: date }
            installation_slot: { type: [string, 'null'] }
            address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
            payment_method: { type: [string, 'null'] }
            customer_note: { type: [string, 'null'] }
        coupon:
          oneOf:
            - { type: object, required: [code, label, discount], properties: { code: { type: string }, label: { type: string }, discount: { $ref: '#/components/schemas/Money' } } }
            - { type: 'null' }
        delivery:
          type: object
          required: [zone, fee, fee_label, window_label, requires_slot, slots]
          properties:
            zone: { type: object, required: [key, label], properties: { key: { type: string }, label: { type: string } } }
            fee: { $ref: '#/components/schemas/Money' }
            fee_label: { type: [string, 'null'] }
            window_label: { type: string }
            requires_slot: { type: boolean }
            slots: { type: array, items: { $ref: '#/components/schemas/DeliverySlot' } }
            method:
              oneOf:
                - { $ref: '#/components/schemas/ShippingMethodRef' }
                - { type: 'null' }
            methods:
              type: array
              description: Shipping methods offered for this cart (store settings + shipping rules); pick with PATCH cart {shipping_method}
              items: { $ref: '#/components/schemas/ShippingMethod' }
            notices: { type: array, items: { type: string } }
        installation_schedule:
          type: object
          description: Installation visit picker; required = an installation is selected and the zone has an installation schedule
          required: [required, slots]
          properties:
            required: { type: boolean }
            slots:
              type: array
              items:
                type: object
                required: [date, weekday, day_label, times]
                properties:
                  date: { type: string, format: date }
                  weekday: { type: string }
                  day_label: { type: string }
                  times: { type: array, items: { type: object, required: [key, label], properties: { key: { type: string }, label: { type: string } } } }
        addons:
          type: object
          required: [packaging, installation]
          properties:
            packaging:
              oneOf:
                - { type: object, required: [label, description, fee], properties: { label: { type: string }, description: { type: string }, fee: { $ref: '#/components/schemas/Money' }, default_selected: { type: boolean }, fee_label: { type: string, description: 'Totals row title for the packaging fee' } } }
                - { type: 'null' }
            installation:
              type: object
              required: [label, item_label, description, available_in_zone, available_items, selected_items]
              properties:
                label: { type: string }
                item_label: { type: string }
                description: { type: string }
                available_in_zone: { type: boolean }
                available_items: { type: integer }
                selected_items: { type: integer }
        payment_methods: { type: array, items: { $ref: '#/components/schemas/PaymentMethod' } }
        totals: { $ref: '#/components/schemas/CartTotals' }
        issues:
          type: array
          items: { type: object, required: [code, message, item_id], properties: { code: { type: string }, message: { type: string }, item_id: { type: [integer, 'null'] } } }
        ready_for_checkout: { type: boolean }
    ShippingMethodRef:
      type: object
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
    ShippingMethod:
      type: object
      required: [key, title, fee, selected]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        fee: { $ref: '#/components/schemas/Money' }
        fee_label: { type: [string, 'null'], description: 'Shown instead of a zero fee, e.g. پس‌کرایه / رایگان' }
        selected: { type: boolean }
    OrderSummary:
      type: object
      required: [number, status, status_label, is_paid, payment_method, payment_method_label, total, item_count, placed_at]
      properties:
        number: { type: string }
        status: { type: string }
        status_label: { type: string }
        is_paid: { type: boolean }
        payment_method: { type: [string, 'null'] }
        payment_method_label: { type: [string, 'null'] }
        total: { $ref: '#/components/schemas/Money' }
        item_count: { type: integer }
        placed_at: { type: [string, 'null'], format: date-time }
    PaymentStart:
      type: object
      required: [method, status, redirect_url, message]
      properties:
        method: { type: string }
        status: { type: string, enum: [redirect, offline] }
        redirect_url: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
    PlacedOrder:
      type: object
      required: [order, access_token, payment]
      properties:
        order: { $ref: '#/components/schemas/OrderSummary' }
        access_token: { type: [string, 'null'], description: Send as X-Order-Token to read/pay this order; null on replay }
        payment: { oneOf: [{ $ref: '#/components/schemas/PaymentStart' }, { type: 'null' }] }
    # --- auth ---
    AuthSettings:
      type: object
      required: [code_length, resend_cooldown, code_ttl, texts]
      properties:
        code_length: { type: integer }
        resend_cooldown: { type: integer, description: Seconds before a new code can be requested }
        code_ttl: { type: integer, description: Seconds a code stays valid }
        texts:
          type: object
          description: "code_subtitle has {phone}, resend_wait has {time}; *_url start with / or https://"
          required: [page_title, phone_title, phone_subtitle, phone_label, phone_placeholder, phone_submit, sending_title, sending_subtitle, code_title, code_subtitle, code_submit, checking_label, resend_wait, resend_label, welcome_title, welcome_subtitle, first_name_label, last_name_label, profile_submit, consent_prefix, terms_label, terms_url, consent_middle, privacy_label, privacy_url, consent_suffix, error_generic, error_network]
          properties:
            page_title: { type: string }
            phone_title: { type: string }
            phone_subtitle: { type: string }
            phone_label: { type: string }
            phone_placeholder: { type: string }
            phone_submit: { type: string }
            sending_title: { type: string }
            sending_subtitle: { type: string }
            code_title: { type: string }
            code_subtitle: { type: string }
            code_submit: { type: string }
            checking_label: { type: string }
            resend_wait: { type: string }
            resend_label: { type: string }
            welcome_title: { type: string }
            welcome_subtitle: { type: string }
            first_name_label: { type: string }
            last_name_label: { type: string }
            profile_submit: { type: string }
            consent_prefix: { type: string }
            terms_label: { type: string }
            terms_url: { type: string }
            consent_middle: { type: string }
            privacy_label: { type: string }
            privacy_url: { type: string }
            consent_suffix: { type: string }
            error_generic: { type: string }
            error_network: { type: string }
    OtpChallenge:
      type: object
      required: [phone, code_length, expires_in, resend_in]
      properties:
        phone: { type: string, description: Normalized 09XXXXXXXXX }
        code_length: { type: integer, const: 4 }
        expires_in: { type: integer, description: Seconds }
        resend_in: { type: integer, description: Seconds until a new code may be requested }
    Customer:
      type: object
      required: [id, first_name, last_name, name, phone, type, needs_profile]
      properties:
        id: { type: string, description: ULID (public id) }
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        name: { type: [string, 'null'], description: Full name; null until the profile is completed }
        phone: { type: string }
        type: { type: string, enum: [consumer, partner], description: 'partner = B2B (WordPress role shop)' }
        needs_profile: { type: boolean, description: true → ask first/last name before continuing }
    CustomerSession:
      type: object
      required: [token, token_type, expires_at, is_new, customer]
      properties:
        token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
        is_new: { type: boolean }
        customer: { $ref: '#/components/schemas/Customer' }
    # --- /auth ---
    # --- account (feature/web-account, banovit-cms feature/storefront-account) ---
    AccountSummary:
      type: object
      required: [name, phone, orders, unread_notifications, open_tickets, identity_complete]
      properties:
        name: { type: string }
        phone: { type: [string, 'null'] }
        orders: { $ref: '#/components/schemas/OrderTabCounts' }
        unread_notifications: { type: integer }
        open_tickets: { type: integer }
        identity_complete: { type: boolean }
    Profile:
      type: object
      required: [name, phone, identity_complete, identity_verified]
      properties:
        name: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        national_code: { type: [string, 'null'] }
        birth_date: { type: [string, 'null'], format: date }
        type: { type: string, enum: [consumer, partner] }
        identity_complete: { type: boolean }
        identity_verified: { type: boolean }
    OrderTabCounts:
      type: object
      required: [current, delivered, cancelled]
      properties:
        current: { type: integer }
        delivered: { type: integer }
        cancelled: { type: integer }
    OrderStep:
      type: object
      required: [key, label, state]
      properties:
        key: { type: string, description: 'paid | preparing | shipped | delivered, or review | refund for a cancelled order' }
        label: { type: string }
        state: { type: string, enum: [done, current, upcoming] }
    AccountOrder:
      type: object
      required: [number, tab, status, status_label, total, items_count, item_images, steps, is_legacy]
      properties:
        number: { type: string }
        tab: { type: string, enum: [current, delivered, cancelled] }
        status: { type: string, description: Raw sales_invoices.status }
        status_label: { type: string, description: Customer wording («درحال بسته‌بندی کالا»، «لغو شده - واریزی عودت شد») }
        ordered_at: { type: [string, 'null'], format: date-time }
        delivery_date: { type: [string, 'null'], format: date }
        total: { $ref: '#/components/schemas/Money' }
        items_count: { type: number }
        item_images: { type: array, items: { $ref: '#/components/schemas/Image' } }
        steps: { type: array, items: { $ref: '#/components/schemas/OrderStep' } }
        address_line: { type: [string, 'null'] }
        is_legacy: { type: boolean, description: Came from WooCommerce }
    OrderItem:
      type: object
      required: [id, name, quantity, unit_price, total, attributes]
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: [string, 'null'] }
        quantity: { type: number }
        cancelled_quantity: { type: number }
        unit_price: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        attributes: { type: array, items: { type: object, required: [name, value], properties: { name: { type: string }, value: { type: string } } } }
        product:
          type: [object, 'null']
          properties:
            slug: { type: string }
            path: { type: [string, 'null'] }
            image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
    AccountOrderDetail:
      allOf:
        - $ref: '#/components/schemas/AccountOrder'
        - type: object
          required: [recipient, items, totals, shipments, can_rate]
          properties:
            recipient:
              type: object
              properties:
                name: { type: [string, 'null'] }
                phone: { type: [string, 'null'] }
                address: { type: [string, 'null'] }
                postal_code: { type: [string, 'null'] }
            items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
            totals:
              type: object
              required: [subtotal, discount, shipping, tax, total, paid, balance_due]
              properties:
                subtotal: { $ref: '#/components/schemas/Money' }
                discount: { $ref: '#/components/schemas/Money' }
                shipping: { $ref: '#/components/schemas/Money' }
                tax: { $ref: '#/components/schemas/Money' }
                total: { $ref: '#/components/schemas/Money' }
                paid: { $ref: '#/components/schemas/Money' }
                balance_due: { $ref: '#/components/schemas/Money' }
            payment_method: { type: [string, 'null'] }
            customer_note: { type: [string, 'null'] }
            shipments:
              type: array
              items:
                type: object
                properties:
                  method: { type: string }
                  method_label: { type: string }
                  status: { type: string }
                  tracking_number: { type: [string, 'null'] }
                  carrier_name: { type: [string, 'null'] }
                  carrier_phone: { type: [string, 'null'] }
                  shipped_at: { type: [string, 'null'], format: date-time }
            refund:
              type: [object, 'null']
              required: [status, amount]
              properties:
                status: { type: string, enum: [pending, approved, rejected] }
                amount: { $ref: '#/components/schemas/Money' }
                created_at: { type: [string, 'null'], format: date-time }
            can_rate: { type: boolean }
    CustomerAddressInput:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 100 }
        recipient_name: { type: [string, 'null'], maxLength: 150 }
        recipient_phone: { type: [string, 'null'], pattern: '^09\d{9}$' }
        province: { type: string }
        city: { type: string }
        address_line: { type: string, minLength: 5, maxLength: 500 }
        plaque: { type: [string, 'null'] }
        unit: { type: [string, 'null'] }
        postal_code: { type: [string, 'null'], pattern: '^\d{10}$' }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        is_default: { type: boolean }
    CustomerAddress:
      allOf:
        - $ref: '#/components/schemas/CustomerAddressInput'
        - type: object
          required: [id, province, city, address_line, is_default, full_line]
          properties:
            id: { type: string, description: ULID; checkout accepts it as address_id }
            full_line: { type: string }
    MyReview:
      type: object
      required: [id, body, status, is_verified_buyer]
      properties:
        id: { type: integer }
        author_name: { type: [string, 'null'] }
        rating: { type: [integer, 'null'] }
        body: { type: string }
        status: { type: string, enum: [pending, approved] }
        is_verified_buyer: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        product:
          type: [object, 'null']
          required: [slug, name, path]
          properties:
            slug: { type: string }
            name: { type: string }
            path: { type: string }
            image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
            colors: { type: array, items: { type: object } }
            sizes: { type: [object, 'null'] }
    Notification:
      type: object
      required: [id, category, type, title, is_read]
      properties:
        id: { type: string }
        category: { type: string, enum: [orders, products, support] }
        type: { type: string }
        title: { type: string }
        body: { type: [string, 'null'] }
        url: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
        data: { type: object }
        is_read: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
    TicketTopic:
      type: string
      enum: [orders, payment, shipping, returns, buying, specs, other]
    TicketSummary:
      type: object
      required: [id, number, subject, topic, status, status_label]
      properties:
        id: { type: string }
        number: { type: string, example: SU-21281 }
        subject: { type: string }
        topic: { $ref: '#/components/schemas/TicketTopic' }
        topic_label: { type: string }
        status: { type: string, enum: [in_review, awaiting_customer, closed] }
        status_label: { type: string }
        order_number: { type: [string, 'null'] }
        last_message_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    TicketMessage:
      type: object
      required: [id, author, attachments, is_read]
      properties:
        id: { type: integer }
        author: { type: string, enum: [customer, staff] }
        body: { type: [string, 'null'] }
        attachments: { type: array, items: { type: object, properties: { name: { type: [string, 'null'] }, mime: { type: [string, 'null'] }, size: { type: [integer, 'null'] }, url: { type: string } } } }
        is_read: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          required: [messages, can_reply]
          properties:
            messages: { type: array, items: { $ref: '#/components/schemas/TicketMessage' } }
            can_reply: { type: boolean }
    AccountSettings:
      type: object
      required: [support, orders, notifications, menu, empty_states, limits, map]
      properties:
        support:
          type: object
          required: [phone, heading, success_title, success_text, form_hint, max_images, max_image_mb, topics]
          properties:
            phone: { type: [string, 'null'] }
            heading: { type: [string, 'null'] }
            success_title: { type: [string, 'null'] }
            success_text: { type: [string, 'null'] }
            form_hint: { type: [string, 'null'] }
            max_images: { type: integer }
            max_image_mb: { type: integer }
            topics:
              type: array
              description: Enabled topics only, in panel order
              items:
                type: object
                required: [key, title, subtitle, needs_order, enabled, faq]
                properties:
                  key: { type: string }
                  title: { type: string }
                  subtitle: { type: [string, 'null'] }
                  needs_order: { type: boolean }
                  enabled: { type: boolean }
                  faq: { type: array, items: { type: object, required: [q, a], properties: { q: { type: string }, a: { type: string } } } }
        orders:
          type: object
          required: [status_labels, step_labels]
          properties:
            status_labels: { type: object, additionalProperties: { type: string } }
            step_labels: { type: object, additionalProperties: { type: string } }
        notifications: { type: object, additionalProperties: true }
        menu:
          type: array
          items: { type: object, required: [key, group, label, href, enabled], properties: { key: { type: string }, group: { type: string, enum: [shopping, services] }, label: { type: string }, href: { type: string }, enabled: { type: boolean } } }
        empty_states:
          type: object
          additionalProperties:
            type: object
            required: [title, text, image_url]
            properties:
              title: { type: [string, 'null'] }
              text: { type: [string, 'null'] }
              image_url: { type: [string, 'null'] }
        limits:
          type: object
          required: [max_addresses, recently_viewed]
          properties:
            max_addresses: { type: integer }
            recently_viewed: { type: integer }
        map:
          type: object
          required: [tile_url, attribution, geocoder_url, default_lat, default_lng, default_zoom]
          properties:
            tile_url: { type: string }
            attribution: { type: [string, 'null'] }
            geocoder_url: { type: [string, 'null'] }
            default_lat: { type: number }
            default_lng: { type: number }
            default_zoom: { type: integer }
    # --- /account ---
    # --- blog ---
    Crumb:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    BlogCategoryRef:
      type: object
      required: [id, name, slug, path, url]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        path: { type: string }
        url: { type: string }
    BlogCategoryTab:
      allOf:
        - $ref: '#/components/schemas/BlogCategoryRef'
        - type: object
          required: [parent_id, post_count]
          properties:
            parent_id: { type: [integer, 'null'] }
            post_count: { type: integer }
    BlogAuthorRef:
      type: object
      required: [name, slug, url]
      properties:
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        avatar: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
    BlogPostCard:
      type: object
      required: [id, slug, url, title, excerpt, cover, category, author, published_at, updated_at, reading_minutes, views]
      properties:
        id: { type: integer }
        slug: { type: string }
        url: { type: string }
        title: { type: string }
        excerpt: { type: string }
        cover: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        category: { oneOf: [{ $ref: '#/components/schemas/BlogCategoryRef' }, { type: 'null' }] }
        author: { oneOf: [{ $ref: '#/components/schemas/BlogAuthorRef' }, { type: 'null' }] }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        reading_minutes: { type: integer }
        views: { type: integer }
    BlogAuthor:
      type: object
      required: [name, slug, url, job_title, bio, avatar, social]
      properties:
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        job_title: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        avatar: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        social: { type: object, additionalProperties: { type: string } }
    BlogAuthorPage:
      allOf:
        - $ref: '#/components/schemas/BlogAuthor'
        - type: object
          required: [breadcrumb, seo]
          properties:
            breadcrumb: { type: array, items: { $ref: '#/components/schemas/Crumb' } }
            seo: { $ref: '#/components/schemas/Seo' }
    BlogHtmlBlock:
      type: object
      required: [type, html]
      properties:
        type: { type: string, const: html }
        html: { type: string, description: Sanitized HTML; h2/h3 carry the ids used by toc }
    BlogProductsBlock:
      type: object
      required: [type, props]
      properties:
        type: { type: string, const: products }
        props:
          type: object
          required: [layout, products]
          properties:
            layout: { type: string, enum: [card, carousel] }
            title: { type: [string, 'null'] }
            subtitle: { type: [string, 'null'] }
            badge: { type: [string, 'null'], description: Card label (default «محصول پیشنهادی») }
            button: { type: [string, 'null'], description: Card button / carousel «view all» text }
            button_url: { type: [string, 'null'], description: Carousel «view all» link (the product category page) }
            products: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
    BlogNoteBlock:
      type: object
      required: [type, props]
      properties:
        type: { type: string, const: note }
        props:
          type: object
          properties:
            title: { type: string }
            theme: { type: string, enum: [red, green, orange], description: Absent = default blue }
            html: { type: string }
    BlogArticleBlock:
      type: object
      required: [type, props]
      description: Suggested post card inside the article («مقاله پیشنهادی»)
      properties:
        type: { type: string, const: article }
        props:
          type: object
          required: [label, button, post]
          properties:
            label: { type: string }
            button: { type: string }
            post: { $ref: '#/components/schemas/BlogPostCard' }
    BlogQuizQuestion:
      type: object
      required: [question, options, correct]
      properties:
        question: { type: string }
        options: { type: array, items: { type: string } }
        correct: { type: integer, description: 0-based index into options }
    BlogQuizBlock:
      type: object
      required: [type, props]
      description: Multiple-choice self-check, graded in the browser
      properties:
        type: { type: string, const: quiz }
        props:
          type: object
          required: [title, button, result, incomplete, questions]
          properties:
            title: { type: string }
            subtitle: { type: [string, 'null'] }
            button: { type: string }
            result: { type: string, description: 'Template with {correct} and {total}' }
            incomplete: { type: string }
            questions: { type: array, items: { $ref: '#/components/schemas/BlogQuizQuestion' } }
    BlogMapBlock:
      type: object
      required: [type, props]
      properties:
        type: { type: string, const: map }
        props:
          type: object
          required: [lat, lng]
          properties:
            lat: { type: number }
            lng: { type: number }
            label: { type: [string, 'null'] }
    BlogStatBlock:
      type: object
      required: [type, props]
      description: Live value placed by the author ([post-views] / [last_update]); value = view count, or ISO date of the last update
      properties:
        type: { type: string, const: stat }
        props:
          type: object
          required: [kind, value]
          properties:
            kind: { type: string, enum: [views, updated] }
            value: { type: string }
    BlogBlock:
      oneOf:
        - $ref: '#/components/schemas/BlogHtmlBlock'
        - $ref: '#/components/schemas/BlogProductsBlock'
        - $ref: '#/components/schemas/BlogNoteBlock'
        - $ref: '#/components/schemas/BlogArticleBlock'
        - $ref: '#/components/schemas/BlogQuizBlock'
        - $ref: '#/components/schemas/BlogMapBlock'
        - $ref: '#/components/schemas/BlogStatBlock'
    TocItem:
      type: object
      required: [id, text, level]
      properties:
        id: { type: string }
        text: { type: string }
        level: { type: integer, enum: [2, 3] }
    BlogFaq:
      type: object
      required: [question, answer_html]
      properties:
        question: { type: string }
        answer_html: { type: string }
    BlogBanner:
      type: object
      required: [image]
      properties:
        image: { $ref: '#/components/schemas/Image' }
        url: { type: [string, 'null'] }
    BlogPost:
      allOf:
        - $ref: '#/components/schemas/BlogPostCard'
        - type: object
          required: [summary_html, blocks, toc, categories, tags, author_profile, faqs, related_products, related_posts, breadcrumb, banner, sidebar, schema_type, word_count, seo]
          properties:
            summary_html: { type: [string, 'null'] }
            blocks: { type: array, items: { $ref: '#/components/schemas/BlogBlock' } }
            toc: { type: array, items: { $ref: '#/components/schemas/TocItem' } }
            categories: { type: array, items: { $ref: '#/components/schemas/BlogCategoryRef' } }
            tags: { type: array, items: { type: object, required: [name, slug, url], properties: { name: { type: string }, slug: { type: string }, url: { type: string } } } }
            author_profile: { oneOf: [{ $ref: '#/components/schemas/BlogAuthor' }, { type: 'null' }] }
            faqs: { type: array, items: { $ref: '#/components/schemas/BlogFaq' } }
            related_products: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
            related_posts: { type: array, items: { $ref: '#/components/schemas/BlogPostCard' } }
            breadcrumb: { type: array, items: { $ref: '#/components/schemas/Crumb' } }
            banner: { oneOf: [{ $ref: '#/components/schemas/BlogBanner' }, { type: 'null' }] }
            sidebar: { $ref: '#/components/schemas/BlogPostSidebar' }
            schema_type: { type: string, enum: [BlogPosting, Article, NewsArticle] }
            word_count: { type: integer }
            seo: { $ref: '#/components/schemas/Seo' }
    BlogPostSidebar:
      type: object
      description: The single-post sidebar as configured in the CMS panel (ordered sections; the toc section's items come from `toc`)
      required: [sections]
      properties:
        sections: { type: array, items: { $ref: '#/components/schemas/BlogSidebarSection' } }
    BlogSidebarSection:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [banners, toc, recent_posts, recent_comments] }
        accent: { type: [string, 'null'], description: Blue part of the heading («جدید ترین») }
        title: { type: [string, 'null'], description: Rest of the heading («مقاله ها») }
        card_title: { type: [string, 'null'] }
        interval_seconds: { type: integer }
        banners:
          type: array
          items:
            type: object
            required: [image, url]
            properties:
              image: { $ref: '#/components/schemas/Image' }
              url: { type: [string, 'null'] }
        posts: { type: array, items: { $ref: '#/components/schemas/BlogPostCard' } }
        comments:
          type: array
          items:
            type: object
            required: [author, text, title, url]
            properties:
              author: { type: string }
              text: { type: string }
              title: { type: string }
              url: { type: string }
    BlogUi:
      type: object
      required: [labels, post_page, blocks]
      properties:
        labels:
          type: object
          properties:
            breadcrumb_root: { type: [string, 'null'] }
            search_placeholder: { type: [string, 'null'] }
            categories_title: { type: [string, 'null'] }
            empty: { type: [string, 'null'] }
            more: { type: [string, 'null'] }
            featured_title: { type: [string, 'null'] }
            feed_description: { type: [string, 'null'] }
        post_page:
          type: object
          properties:
            show_summary: { type: boolean }
            summary_title: { type: [string, 'null'] }
            show_tags: { type: boolean }
            show_author_box: { type: boolean }
            faq_title: { type: [string, 'null'] }
            related_products: { $ref: '#/components/schemas/BlogUiSection' }
            related_posts: { $ref: '#/components/schemas/BlogUiSection' }
            share:
              type: object
              properties:
                enabled: { type: boolean }
                title: { type: [string, 'null'] }
                items:
                  type: array
                  items:
                    type: object
                    required: [type]
                    properties:
                      type: { type: string, enum: [copy, telegram, whatsapp, instagram, aparat] }
                      url: { type: [string, 'null'] }
            toc:
              type: object
              properties:
                title: { type: [string, 'null'] }
                mobile_floating: { type: boolean }
                include_faq: { type: boolean }
                collapse_after_px: { type: integer }
                more: { type: [string, 'null'] }
                less: { type: [string, 'null'] }
        blocks:
          type: object
          properties:
            map: { type: object, properties: { label: { type: [string, 'null'] }, link: { type: [string, 'null'] } } }
            stat: { type: object, properties: { views: { type: [string, 'null'] }, updated: { type: [string, 'null'] } } }
    BlogUiSection:
      type: object
      properties:
        enabled: { type: boolean }
        title: { type: [string, 'null'] }
        subtitle: { type: [string, 'null'] }
        limit: { type: integer }
    BlogCategory:
      allOf:
        - $ref: '#/components/schemas/BlogCategoryRef'
        - type: object
          required: [description_html, image, children, breadcrumb, seo]
          properties:
            description_html: { type: [string, 'null'] }
            image: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
            children: { type: array, items: { $ref: '#/components/schemas/BlogCategoryRef' } }
            breadcrumb: { type: array, items: { $ref: '#/components/schemas/Crumb' } }
            seo: { $ref: '#/components/schemas/Seo' }
    BlogTerm:
      type: object
      required: [name, slug, url, description_html, breadcrumb, seo]
      properties:
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        description_html: { type: [string, 'null'] }
        breadcrumb: { type: array, items: { $ref: '#/components/schemas/Crumb' } }
        seo: { $ref: '#/components/schemas/Seo' }
    BlogPostListing:
      type: object
      required: [data, meta, links]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BlogPostCard' } }
        meta:
          type: object
          required: [page, per_page, total, last_page]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
        links:
          type: object
          properties:
            next: { type: [integer, 'null'] }
            prev: { type: [integer, 'null'] }
    BlogSection:
      type: object
      required: [title, posts]
      properties:
        key: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/BlogCategoryRef' }
        posts: { type: array, items: { $ref: '#/components/schemas/BlogPostCard' } }
    BlogHome:
      type: object
      required: [hero, categories, popular, latest, sections, promo, all, seo]
      properties:
        hero: { type: array, items: { $ref: '#/components/schemas/BlogPostCard' } }
        categories: { type: array, items: { $ref: '#/components/schemas/BlogCategoryTab' } }
        popular: { $ref: '#/components/schemas/BlogSection' }
        latest: { $ref: '#/components/schemas/BlogSection' }
        sections: { type: array, items: { $ref: '#/components/schemas/BlogSection' } }
        promo:
          oneOf:
            - type: 'null'
            - type: object
              required: [title, url]
              properties:
                title: { type: string }
                text: { type: [string, 'null'] }
                cta: { type: [string, 'null'] }
                url: { type: string }
        all:
          allOf:
            - $ref: '#/components/schemas/BlogSection'
            - type: object
              required: [total]
              properties:
                total: { type: integer }
        seo: { $ref: '#/components/schemas/Seo' }
    SitemapRow:
      type: object
      required: [url, lastmod, images]
      properties:
        url: { type: string }
        lastmod: { type: [string, 'null'], format: date-time }
        images: { type: array, items: { type: string } }
    # --- /blog ---
