# cms-new.banovit.com inside the container: Laravel public/ + php-fpm (service "cms").
# Never indexable on stage2.
server {
    listen 80 default_server;
    root /var/www/cms/public;
    index index.php;
    client_max_body_size 20m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass cms:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cms/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/cms/public;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
